# ld65 memory map for Contra III (USA): 1 MiB LoROM, 32 banks of $8000.
# Generated by tools/disasm.py.  Unused space at the end of every bank is
# filled with $FF by the linker (fill = yes), not by the source, so code and
# data can grow or shrink (see the book, "Shiftability").

MEMORY {
    ROM00: start = $008000, size = $8000, fill = yes, fillval = $FF;
    ROM01: start = $018000, size = $8000, fill = yes, fillval = $FF;
    ROM02: start = $028000, size = $8000, fill = yes, fillval = $FF;
    ROM03: start = $038000, size = $8000, fill = yes, fillval = $FF;
    ROM04: start = $048000, size = $8000, fill = yes, fillval = $FF;
    ROM05: start = $058000, size = $8000, fill = yes, fillval = $FF;
    ROM06: start = $068000, size = $8000, fill = yes, fillval = $FF;
    ROM07: start = $078000, size = $8000, fill = yes, fillval = $FF;
    ROM08: start = $088000, size = $8000, fill = yes, fillval = $FF;
    ROM09: start = $098000, size = $8000, fill = yes, fillval = $FF;
    ROM0A: start = $0A8000, size = $8000, fill = yes, fillval = $FF;
    ROM0B: start = $0B8000, size = $8000, fill = yes, fillval = $FF;
    ROM0C: start = $0C8000, size = $8000, fill = yes, fillval = $FF;
    ROM0D: start = $0D8000, size = $8000, fill = yes, fillval = $FF;
    ROM0E: start = $0E8000, size = $8000, fill = yes, fillval = $FF;
    ROM0F: start = $0F8000, size = $8000, fill = yes, fillval = $FF;
    ROM10: start = $108000, size = $8000, fill = yes, fillval = $FF;
    ROM11: start = $118000, size = $8000, fill = yes, fillval = $FF;
    ROM12: start = $128000, size = $8000, fill = yes, fillval = $FF;
    ROM13: start = $138000, size = $8000, fill = yes, fillval = $FF;
    ROM14: start = $148000, size = $8000, fill = yes, fillval = $FF;
    ROM15: start = $158000, size = $8000, fill = yes, fillval = $FF;
    ROM16: start = $168000, size = $8000, fill = yes, fillval = $FF;
    ROM17: start = $178000, size = $8000, fill = yes, fillval = $FF;
    ROM18: start = $188000, size = $8000, fill = yes, fillval = $FF;
    ROM19: start = $198000, size = $8000, fill = yes, fillval = $FF;
    ROM1A: start = $1A8000, size = $8000, fill = yes, fillval = $FF;
    ROM1B: start = $1B8000, size = $8000, fill = yes, fillval = $FF;
    ROM1C: start = $1C8000, size = $8000, fill = yes, fillval = $FF;
    ROM1D: start = $1D8000, size = $8000, fill = yes, fillval = $FF;
    ROM1E: start = $1E8000, size = $8000, fill = yes, fillval = $FF;
    ROM1F: start = $1F8000, size = $8000, fill = yes, fillval = $FF;
}

SEGMENTS {
    BANK00: load = ROM00, type = ro;
    # The internal header and vectors must stay at $00:FFC0 however long
    # bank $00's code gets.
    HEADER: load = ROM00, type = ro, start = $00FFC0;
    BANK01: load = ROM01, type = ro;
    BANK02: load = ROM02, type = ro;
    BANK03: load = ROM03, type = ro;
    BANK04: load = ROM04, type = ro;
    BANK05: load = ROM05, type = ro;
    BANK06: load = ROM06, type = ro;
    BANK07: load = ROM07, type = ro;
    BANK08: load = ROM08, type = ro;
    BANK09: load = ROM09, type = ro;
    BANK0A: load = ROM0A, type = ro;
    BANK0B: load = ROM0B, type = ro;
    BANK0C: load = ROM0C, type = ro;
    BANK0D: load = ROM0D, type = ro;
    BANK0E: load = ROM0E, type = ro;
    BANK0F: load = ROM0F, type = ro;
    BANK10: load = ROM10, type = ro;
    BANK11: load = ROM11, type = ro;
    BANK12: load = ROM12, type = ro;
    BANK13: load = ROM13, type = ro;
    BANK14: load = ROM14, type = ro;
    BANK15: load = ROM15, type = ro;
    BANK16: load = ROM16, type = ro;
    BANK17: load = ROM17, type = ro;
    BANK18: load = ROM18, type = ro;
    BANK19: load = ROM19, type = ro;
    BANK1A: load = ROM1A, type = ro;
    BANK1B: load = ROM1B, type = ro;
    BANK1C: load = ROM1C, type = ro;
    BANK1D: load = ROM1D, type = ro;
    BANK1E: load = ROM1E, type = ro;
    BANK1F: load = ROM1F, type = ro;
}
